name: Publicar D Volada 3.0
# No publicar al fusionar PR: el lanzamiento requiere autorización manual.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.repository == 'dvoladanexora/DVolada-3.0.'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Probar API Online antes de publicar
        run: npm run test:online
      - name: Comprobar temas oficiales antes de publicar
        run: npm run test:theme
      - name: Validar las pruebas de módulos antes de publicar
        run: npm run test:all
      - name: Verificar que el servidor legado continúa compilable y aislado
        run: |
          npm --prefix server ci --ignore-scripts --no-audit --no-fund
          npm --prefix server run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.repository == 'dvoladanexora/DVolada-3.0.'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
