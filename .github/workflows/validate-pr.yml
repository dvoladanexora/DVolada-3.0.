name: Validar cambios Dvolada
on:
  push:
    branches: [prelaunch/phase-2-worker-d1, prelaunch/phase-3-live-integration]
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
permissions:
  contents: read
concurrency:
  group: validar-dvolada-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias con versiones congeladas
        run: npm ci --no-audit --no-fund
      - name: Rechazar vulnerabilidades altas conocidas
        run: |
          npm audit --audit-level=high
          npm --prefix server audit --omit=dev --audit-level=high
      - name: Pruebas de API Online
        run: npm run test:online
      - name: Pruebas de bienvenida, feed y publicidad
        run: npm run test:preview
      - name: Pruebas de compartir, instalación y sonido
        run: npm run test:share
      - name: Probar colores oficiales y modo claro/oscuro
        run: npm run test:theme
      - name: Validar cliente API real sin datos locales
        run: npm run test:live
      - name: Probar acceso público y teléfono obligatorio
        run: npm run test:access
      - name: Probar notificaciones web y despacho seguro
        run: npm run test:push
      - name: Probar PWA de staging de Cloudflare Pages
        run: npm run test:staging
      - name: Regresión integral de módulos heredados y D1 sin datos reales
        run: npm run test:all
      - name: Validar sintaxis del servidor legado aislado
        run: node --check server/src/server.js
      - name: Validar sintaxis de Firebase verificado
        run: node --check backend/src/firebase-identity.js
      - name: Validar backend Cloudflare con base SQLite y flujos reales
        run: node --experimental-sqlite --test backend/tests/worker.test.js backend/tests/beta-gate.test.js
      - name: Compilar Worker Cloudflare sin desplegar ni usar credenciales
        run: |
          npm install --prefix backend --no-audit --no-fund
          npm run deploy:dry --prefix backend
      - name: Compilar interfaz real Cloudflare en modo seguro de previsualización
        env:
          VITE_DVOLADA_LIVE_MODE: 'true'
          VITE_DVOLADA_API_URL: https://api.example.invalid
        run: npm run build
      - name: Compilar la demostración pública de GitHub Pages
        run: npm run build
      - name: Verificar que no se publique Device Studio
        run: test ! -e dist/device-studio.html
      - name: Empaquetar la aplicación de QA con sus paneles habilitados
        env:
          VITE_DVOLADA_LIVE_MODE: 'true'
          VITE_DVOLADA_STAGING_PANELS: 'true'
        run: npm run build && node scripts/package-qa-worker.mjs

  legacy-postgres:
    name: Verificar seguridad del servidor PostgreSQL legado
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dvolada_test
          POSTGRES_PASSWORD: ci-isolated-credentials
          POSTGRES_DB: dvolada_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dvolada_test -d dvolada_security_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias reproducibles del servidor legado
        run: npm --prefix server ci --ignore-scripts --no-audit --no-fund
      - name: Comprobar sintaxis y aislamiento de pedidos PostgreSQL
        run: npm --prefix server run check
      - name: Probar permisos, concurrencia y auditoría con PostgreSQL descartable
        env:
          DVOLADA_TEST_DATABASE_URL: postgres://dvolada_test:ci-isolated-credentials@127.0.0.1:5432/dvolada_security_test
        run: npm --prefix server run test:db

  qa-smoke:
    name: Comprobar React QA, Workers/D1 y build sin depender del legado
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar frontend de forma reproducible
        run: npm ci --no-audit --no-fund
      - name: Probar acceso, OneSignal, PWA y cliente API
        run: |
          npm run test:live
          npm run test:access
          npm run test:push
          npm run test:staging
      - name: Probar Worker con SQLite descartable
        run: node --experimental-sqlite --test backend/tests/worker.test.js backend/tests/beta-gate.test.js
      - name: Construir artefacto canónico de Dvolada Online
        env:
          DVOLADA_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/build-online-release.sh
      - name: Conservar el artefacto probado y su huella
        uses: actions/upload-artifact@v4
        with:
          name: dvolada-online-${{ github.event.pull_request.head.sha || github.sha }}
          path: online-release/
          if-no-files-found: error
      - name: Compilar demostración pública sin desplegar
        run: npm run build
