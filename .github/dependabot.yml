version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 4
    labels: ["dependencies", "security"]
  - package-ecosystem: npm
    directory: "/server"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 4
    labels: ["dependencies", "security"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: ["dependencies", "security"]
