name: Publicar D Volada 3.0
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exigir dependencias reproducibles antes de publicar
        run: |
          test -f package-lock.json || { echo "::error::Falta package-lock.json revisado"; exit 1; }
          test -f server/package-lock.json || { echo "::error::Falta server/package-lock.json revisado"; exit 1; }
      - name: Instalar versiones aprobadas sin alterar dependencias
        run: |
          npm ci --no-audit --no-fund
          npm --prefix server ci --ignore-scripts --no-audit --no-fund
      - name: Bloquear publicación por dependencias vulnerables
        run: |
          npm audit --audit-level=high
          npm --prefix server audit --omit=dev --audit-level=high
      - name: Ejecutar TODAS las pruebas antes de publicar
        run: npm run test:all
      - name: Validar servidor preliminar
        run: npm run check:server
      - run: npm run build
      - name: Evitar publicar páginas internas de QA
        run: test ! -e dist/device-studio.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
